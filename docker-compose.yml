# AI 数字化人才平台 · 一键启动（镜像来自 ghcr.io）
#   docker compose up -d
# 首次启动 api 容器会自动建库、建表、灌种子数据与演示账号（可用 DB_AUTO_INIT=0 关闭）。
name: ai-talent-platform

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ai_talent
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/moliclay/ai-talent-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-123456}@mysql:3306/ai_talent?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-mvp1-dev-secret-change-me-in-prod}
      STORAGE_BACKEND: local
      STORAGE_DIR: /app/storage
      # AI 能力：默认关闭（规则回退可用）。要用大模型/向量，填好自己的网关后设为 1
      AI_ENABLED: ${AI_ENABLED:-0}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:3065/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://host.docker.internal:11434}
      MILVUS_URI: ${MILVUS_URI:-http://host.docker.internal:19530}
    volumes:
      - api-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  web:
    image: ghcr.io/moliclay/ai-talent-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
  api-storage:
